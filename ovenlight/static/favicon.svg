<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="lg-bg" cx=".28" cy=".18" r=".95">
      <stop offset="0" stop-color="#3a2219"/>
      <stop offset=".55" stop-color="#151012"/>
      <stop offset="1" stop-color="#0a0a0b"/>
